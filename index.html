</script>
<style>
/* ============================================================
   F1Soft FP&A — design system  (premium dark "executive" theme)
   Craft-first: glass surfaces, layered depth, living aurora,
   purposeful motion. Every legacy class name is preserved.
   ============================================================ */
:root{
  --acc:#4f9cf9; --acc2:#8b6cf6; --acc-ink:#bfe0ff;
  --navy:#0b1220; --blue:#4f9cf9;
  --ink:#eef3fc; --ink2:#c4cfe4; --muted:#8593ae;
  --green:#3ddc97; --red:#fb7185; --amber:#fbbf24;
  --bg:#070b14; --bg2:#0a1020;
  --card:#111a2e; --card2:#18233d;
  --surf-1:rgba(23,32,55,.62); --surf-2:rgba(12,18,34,.74);
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.16);
  --r:14px; --r-lg:18px; --r-sm:10px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --sh-1:inset 0 1px 0 rgba(255,255,255,.05), 0 16px 36px -26px rgba(0,0,0,.92);
  --sh-2:inset 0 1px 0 rgba(255,255,255,.07), 0 30px 60px -30px rgba(0,0,0,.95);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100vh;letter-spacing:.1px;overflow-x:hidden}
::selection{background:color-mix(in srgb,var(--acc) 40%,transparent);color:#fff}
.v,td,th,.kpi .v,.st .v,.chip .v{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv01" 1}

/* ---- living aurora backdrop ---- */
body::before{content:"";position:fixed;inset:-25%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(38% 36% at 20% 8%, rgba(56,120,255,.18), transparent 70%),
    radial-gradient(40% 38% at 84% 4%, rgba(139,108,246,.13), transparent 72%),
    radial-gradient(46% 42% at 78% 96%, rgba(45,212,191,.07), transparent 76%);
  filter:blur(28px);animation:drift 30s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.04) .5px,transparent .5px);background-size:3px 3px}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(0,-2%,0) scale(1.07)}}

/* ---- header (glass) ---- */
header{position:sticky;top:0;z-index:30;color:#fff;padding:11px 14px 12px;
  padding-top:calc(11px + env(safe-area-inset-top));
  background:linear-gradient(180deg,rgba(10,16,32,.86),rgba(9,14,28,.72));
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 12px 30px -18px rgba(0,0,0,.8)}
.brand{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:17.5px;letter-spacing:-.2px;display:flex;align-items:center;gap:1px}
.logo b{color:#ff5a5f}
.brand .sub{font-size:9.5px;opacity:.72;margin-left:auto;text-align:right;line-height:1.25;letter-spacing:.2px}

/* ---- nav select ---- */
select{width:100%;margin-top:10px;padding:12px 13px;font-size:15px;border:1px solid var(--line2);border-radius:12px;
  background:rgba(8,14,28,.5);color:#fff;font-weight:700;appearance:none;cursor:pointer;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237fb4ff' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center}
select:hover{border-color:rgba(127,180,255,.5)}
select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
select option{background:#111a2e;color:#fff}

/* ---- layout ---- */
.wrap{max-width:960px;margin:0 auto;padding:13px 12px calc(60px + env(safe-area-inset-bottom))}
footer{max-width:960px;margin:0 auto;padding:6px 14px 34px;font-size:10px;color:var(--muted);line-height:1.55}

/* ---- company hero ---- */
.cohead{position:relative;border-radius:var(--r-lg);padding:15px 17px;color:#fff;margin-bottom:12px;overflow:hidden;
  background:linear-gradient(125deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#0a1730));
  box-shadow:0 24px 50px -26px color-mix(in srgb,var(--acc) 55%,#000), inset 0 1px 0 rgba(255,255,255,.16)}
.cohead::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 130% at 92% -20%,rgba(255,255,255,.16),transparent 58%)}
.cohead::after{content:"";position:absolute;right:-50px;bottom:-70px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.1),transparent);pointer-events:none}
.cohead .row{position:relative;display:flex;align-items:center;gap:12px}
.cohead .nm{font-size:22px;font-weight:800;letter-spacing:-.4px}
.cohead .pill2{display:inline-block;font-size:10px;font-weight:700;background:rgba(255,255,255,.2);
  padding:3px 10px;border-radius:20px;margin-top:4px;backdrop-filter:blur(4px)}
.cohead .hl{position:relative;font-size:12.5px;margin-top:8px;opacity:.96;line-height:1.45}
.fresh{font-size:9.5px;color:rgba(255,255,255,.74);margin-top:6px;letter-spacing:.3px}
.coico{width:48px;height:48px;border-radius:13px;background:#fff;object-fit:contain;padding:6px;flex:0 0 auto;
  box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.coini{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:23px;font-weight:800;background:rgba(255,255,255,.22);color:#fff;flex:0 0 auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}

/* ---- KPI tiles ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:10px}
.kpi{position:relative;overflow:hidden;background:linear-gradient(165deg,var(--surf-1),var(--surf-2));
  border-radius:var(--r);padding:13px 14px 12px;border:1px solid var(--line);box-shadow:var(--sh-1);
  transition:transform .26s var(--ease),box-shadow .26s var(--ease),border-color .26s var(--ease)}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 35%,var(--acc2)))}
.kpi:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 35%,var(--line2));
  box-shadow:var(--sh-2),0 0 30px -10px color-mix(in srgb,var(--acc) 50%,transparent)}
.kpi .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.kpi .v{font-size:22px;font-weight:800;margin-top:3px;line-height:1.05;letter-spacing:-.5px}
.kpi .s{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.3}

/* ---- stat strip ---- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin:11px 0}

function nMon(c){return alen(c.monthly.rev_a)}

function mom3(c){const n=nMon(c);if(n<6)return null;const r=c.monthly.rev_a,l=r[n-1]+r[n-2]+r[n-3],pr=r[n-4]+r[n-5]+r[n-6];return pr?l/pr-1:null}

function movers(){return DATA.order.map(nm=>{const c=DATA.companies[nm];return {nm,yoy:lastYoY(c),t3:mom3(c)}}).filter(x=>x.yoy!=null&&isFinite(x.yoy))}
function forecast(c){const n=nMon(c),ytdA=ytd(c.monthly.rev_a,n),proj=n?ytdA/n*12:0,fyBud=ytd(c.monthly.rev_b,12)||c.tot.rev.b;return {proj,fyBud,vsBud:fyBud?proj/fyBud-1:null,n}}
function cashInj(c){let cum=0;(c.years||[]).forEach(y=>{if(y.eb<0)cum+=y.eb});return cum}
function costRatio(c,b){const x=(c.ctree||[]).find(z=>z.n.indexOf(b)>=0);return x?x.v/(c.tot.rev.a||1):0}
function concentration(c){const rt=c.rtree||[];if(!rt.length)return 0;const tot=rt.reduce((a,x)=>a+x.v,0)||1;return rt[0].v/tot}
function clamp(x){return Math.max(2,Math.min(100,x))}
function healthScore(c){const r=c.ratios,t=c.tot,stage=(t.eb!=null&&t.eb>0)?'Scaling':'Investing';let comp;
  if(stage==='Scaling')comp=[{k:'Profitability',v:clamp((r.eb_m||0)/0.40*100)},{k:'Growth',v:clamp(((r.yoy||0)+0.10)/0.50*100)},{k:'Vs plan',v:clamp((r.bud||0)*100)},{k:'Cost discipline',v:clamp(100-(costRatio(c,'Payroll')+costRatio(c,'Admin'))*100)},{k:'Diversification',v:clamp(100-concentration(c)*100)}];

  let h='<div style="font-size:9.5px;color:var(--muted);font-weight:700;margin:10px 0 2px">REVENUE LINES</div>';
  heads.forEach((x,i)=>h+=`<div class="sld"><label>${x.n} <b id="drL_r${i}">${WF.dr['r'+i]||0}%</b></label><input type="range" data-t="r" data-i="${i}" min="-50" max="100" value="${WF.dr['r'+i]||0}"></div>`);
  h+='<div style="font-size:9.5px;color:var(--muted);font-weight:700;margin:10px 0 2px">COST BUCKETS</div>';
  buckets.forEach((x,i)=>h+=`<div class="sld"><label>${x.n} <b id="drL_c${i}">${WF.dr['c'+i]||0}%</b></label><input type="range" data-t="c" data-i="${i}" min="-50" max="100" value="${WF.dr['c'+i]||0}"></div>`);
  box.innerHTML=h;
  box.querySelectorAll('input[type=range]').forEach(inp=>inp.oninput=()=>{const k=inp.dataset.t+inp.dataset.i;WF.dr[k]=+inp.value;el('drL_'+k).textContent=inp.value+'%';wfRender()});}
function wfRender(){const base=wfBase();let rev1,cost1;
  if(WF.mode==='co'&&WF.drv&&(DATA.companies[WF.co].rtree||[]).length){const c=DATA.companies[WF.co],heads=(c.rtree||[]).slice(0,4),buckets=(c.ctree||[]).slice(0,4);
    rev1=(base.rev-heads.reduce((a,x)=>a+x.v,0))+heads.reduce((a,x,i)=>a+x.v*(1+((WF.dr['r'+i]||0)/100)),0);
    cost1=(base.cost-buckets.reduce((a,x)=>a+x.v,0))+buckets.reduce((a,x,i)=>a+x.v*(1+((WF.dr['c'+i]||0)/100)),0);}
  else{rev1=base.rev*(1+WF.g/100);cost1=base.cost*(1+WF.cg/100)}
  const eb1=rev1-cost1,m1=rev1?eb1/rev1:0,d=eb1-base.eb;
  el('wfout').innerHTML=stat('Revenue','NPR '+fmt(rev1))+stat('Cost','NPR '+fmt(cost1))+stat('EBITDA','NPR '+fmt(eb1),eb1>=0?'pos':'neg')+stat('Margin',Mm(m1),m1>=0?'pos':'neg')+stat('Δ EBITDA',(d>=0?'+':'−')+fmt(Math.abs(d)),d>=0?'pos':'neg');
  let note='';if(WF.mode==='co'){const gnew=DATA.group.ebitda+d;note=`Effect on <b>group EBITDA</b>: NPR ${fmt(DATA.group.ebitda)} → <b>NPR ${fmt(gnew)}</b>.`;}
  if(base.eb<0){const need=Math.round((base.cost/base.rev-1)*100),cut=Math.round((1-base.rev/base.cost)*100);note+=` ${WF.mode==='co'?WF.co:'The group'} reaches break-even at about <b>+${need}% revenue</b> (cost held) — or a <b>${cut}% cost cut</b>.`;}
  el('wfbe').innerHTML=note;
  const afterRev=base.eb+(rev1-base.rev),b0=base.eb/1e6,aR=afterRev/1e6,sc=eb1/1e6;
  charts.filter(x=>x.canvas&&x.canvas.id==='wfch').forEach(x=>x.destroy());
  myChart(el('wfch'),{type:'bar',data:{labels:['Now','Revenue Δ','Cost Δ','Scenario'],datasets:[{data:[[0,b0],[Math.min(b0,aR),Math.max(b0,aR)],[Math.min(aR,sc),Math.max(aR,sc)],[0,sc]],backgroundColor:[base.eb>=0?'#34d399':'#fb7185','#4f9cf9','#e08e0b',eb1>=0?'#7fb4ff':'#fb7185'],borderWidth:0,barPercentage:.9}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>fmt((x.raw[1]-x.raw[0])*1e6)}}},scales:{y:{ticks:{callback:v=>fmt(v*1e6)}}}}});}

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function decryptData(pw){var enc=new TextEncoder();var km=await crypto.subtle.importKey("raw",enc.encode(pw),{name:"PBKDF2"},false,["deriveKey"]);var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.i)},key,b64(ENC.c));return JSON.parse(new TextDecoder().decode(pt))}
async function gate(){var pw=document.getElementById("pw").value;var err=document.getElementById("pwerr");err.style.display="none";try{DATA=await decryptData(pw);var g=document.getElementById("gate");document.getElementById("hdr").style.display="";init();g.classList.add("out");setTimeout(function(){g.style.display="none"},560)}catch(e){err.style.display="block";var c=document.getElementById("gcard");if(c){c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake")}var p=document.getElementById("pw");p.value="";p.focus()}}
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")gate()});
document.getElementById("pw").focus();
