</script>
<style>
/* ============================================================
   F1Soft FP&A — design system  (premium dark "executive" theme)
   Craft-first: glass surfaces, layered depth, living aurora,
   purposeful motion. Every legacy class name is preserved.
   ============================================================ */
:root{
  --acc:#4f9cf9; --acc2:#8b6cf6; --acc-ink:#bfe0ff;
  --navy:#0b1220; --blue:#4f9cf9;
  --ink:#eef3fc; --ink2:#c4cfe4; --muted:#8593ae;
  --green:#3ddc97; --red:#fb7185; --amber:#fbbf24;
  --bg:#070b14; --bg2:#0a1020;
  --card:#111a2e; --card2:#18233d;
  --surf-1:rgba(23,32,55,.62); --surf-2:rgba(12,18,34,.74);
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.16);
  --r:14px; --r-lg:18px; --r-sm:10px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --sh-1:inset 0 1px 0 rgba(255,255,255,.05), 0 16px 36px -26px rgba(0,0,0,.92);
  --sh-2:inset 0 1px 0 rgba(255,255,255,.07), 0 30px 60px -30px rgba(0,0,0,.95);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100vh;letter-spacing:.1px;overflow-x:hidden}
::selection{background:color-mix(in srgb,var(--acc) 40%,transparent);color:#fff}
.v,td,th,.kpi .v,.st .v,.chip .v{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv01" 1}

/* ---- living aurora backdrop ---- */
body::before{content:"";position:fixed;inset:-25%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(38% 36% at 20% 8%, rgba(56,120,255,.18), transparent 70%),
    radial-gradient(40% 38% at 84% 4%, rgba(139,108,246,.13), transparent 72%),
    radial-gradient(46% 42% at 78% 96%, rgba(45,212,191,.07), transparent 76%);
  filter:blur(28px);animation:drift 30s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.04) .5px,transparent .5px);background-size:3px 3px}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(0,-2%,0) scale(1.07)}}

/* ---- header (glass) ---- */
header{position:sticky;top:0;z-index:30;color:#fff;padding:11px 14px 12px;
  padding-top:calc(11px + env(safe-area-inset-top));
  background:linear-gradient(180deg,rgba(10,16,32,.86),rgba(9,14,28,.72));
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 12px 30px -18px rgba(0,0,0,.8)}
.brand{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:17.5px;letter-spacing:-.2px;display:flex;align-items:center;gap:1px}
.logo b{color:#ff5a5f}
.brand .sub{font-size:9.5px;opacity:.72;margin-left:auto;text-align:right;line-height:1.25;letter-spacing:.2px}

/* ---- nav select ---- */
select{width:100%;margin-top:10px;padding:12px 13px;font-size:15px;border:1px solid var(--line2);border-radius:12px;
  background:rgba(8,14,28,.5);color:#fff;font-weight:700;appearance:none;cursor:pointer;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237fb4ff' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 13px center}
select:hover{border-color:rgba(127,180,255,.5)}
select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
select option{background:#111a2e;color:#fff}

/* ---- layout ---- */
.wrap{max-width:960px;margin:0 auto;padding:13px 12px calc(60px + env(safe-area-inset-bottom))}
footer{max-width:960px;margin:0 auto;padding:6px 14px 34px;font-size:10px;color:var(--muted);line-height:1.55}

/* ---- company hero ---- */
.cohead{position:relative;border-radius:var(--r-lg);padding:15px 17px;color:#fff;margin-bottom:12px;overflow:hidden;
  background:linear-gradient(125deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#0a1730));
  box-shadow:0 24px 50px -26px color-mix(in srgb,var(--acc) 55%,#000), inset 0 1px 0 rgba(255,255,255,.16)}
.cohead::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 130% at 92% -20%,rgba(255,255,255,.16),transparent 58%)}
.cohead::after{content:"";position:absolute;right:-50px;bottom:-70px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.1),transparent);pointer-events:none}
.cohead .row{position:relative;display:flex;align-items:center;gap:12px}
.cohead .nm{font-size:22px;font-weight:800;letter-spacing:-.4px}
.cohead .pill2{display:inline-block;font-size:10px;font-weight:700;background:rgba(255,255,255,.2);
  padding:3px 10px;border-radius:20px;margin-top:4px;backdrop-filter:blur(4px)}
.cohead .hl{position:relative;font-size:12.5px;margin-top:8px;opacity:.96;line-height:1.45}
.fresh{font-size:9.5px;color:rgba(255,255,255,.74);margin-top:6px;letter-spacing:.3px}
.coico{width:48px;height:48px;border-radius:13px;background:#fff;object-fit:contain;padding:6px;flex:0 0 auto;
  box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.coini{width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:23px;font-weight:800;background:rgba(255,255,255,.22);color:#fff;flex:0 0 auto;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}

/* ---- KPI tiles ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:10px}
.kpi{position:relative;overflow:hidden;background:linear-gradient(165deg,var(--surf-1),var(--surf-2));
  border-radius:var(--r);padding:13px 14px 12px;border:1px solid var(--line);box-shadow:var(--sh-1);
  transition:transform .26s var(--ease),box-shadow .26s var(--ease),border-color .26s var(--ease)}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 35%,var(--acc2)))}
.kpi:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 35%,var(--line2));
  box-shadow:var(--sh-2),0 0 30px -10px color-mix(in srgb,var(--acc) 50%,transparent)}
.kpi .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.kpi .v{font-size:22px;font-weight:800;margin-top:3px;line-height:1.05;letter-spacing:-.5px}
.kpi .s{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.3}

/* ---- stat strip ---- */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin:11px 0}
.st{background:linear-gradient(165deg,var(--surf-1),var(--surf-2));border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px 9px;text-align:center;transition:transform .22s var(--ease),border-color .22s var(--ease)}
.st:hover{transform:translateY(-2px);border-color:var(--line2)}
.st .l{font-size:8.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
.st .v{font-size:15.5px;font-weight:800;margin-top:2px;letter-spacing:-.3px}

/* ---- cards ---- */
.card{background:linear-gradient(168deg,var(--surf-1),var(--surf-2));border-radius:var(--r);padding:14px 15px;margin:11px 0;
  border:1px solid var(--line);box-shadow:var(--sh-1);
  transition:transform .26s var(--ease),box-shadow .26s var(--ease),border-color .26s var(--ease)}
.card:hover{box-shadow:var(--sh-2);border-color:rgba(255,255,255,.11)}
.card h2{margin:0 0 11px;font-size:11.5px;font-weight:800;color:#dbe4f4;text-transform:uppercase;letter-spacing:.7px;
  display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:3px;height:13px;border-radius:3px;
  background:linear-gradient(180deg,var(--acc),var(--acc2));flex:0 0 auto;box-shadow:0 0 10px -2px var(--acc)}
.card h2 .tag{margin-left:auto;font-weight:700;color:var(--acc);font-size:11px;text-transform:none;letter-spacing:0}
.chart-box{position:relative;height:236px}.chart-box.tall{height:292px}

/* ---- chips ---- */
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:8px}
.chip{background:linear-gradient(165deg,rgba(28,38,64,.7),rgba(16,23,42,.7));border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px 11px;transition:transform .22s var(--ease),border-color .22s var(--ease)}
.chip:hover{transform:translateY(-2px);border-color:var(--line2)}
.chip .l{font-size:9px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:700}
.chip .v{font-size:15.5px;font-weight:800;margin-top:2px;letter-spacing:-.3px}

/* ---- insights / lists ---- */
.ins{list-style:none;padding:0;margin:0}
.ins li{display:flex;gap:9px;font-size:13px;padding:6px 0;line-height:1.4}
.ins li .b{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:0 0 auto;box-shadow:0 0 8px -1px currentColor}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 7px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{font-size:9.5px;text-transform:uppercase;color:var(--muted);font-weight:800;letter-spacing:.4px;cursor:pointer;
  position:sticky;top:0;transition:color .15s}
thead th.act{color:var(--blue)}
thead th:hover{color:var(--ink2)}
tbody tr{transition:background .15s}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:rgba(255,255,255,.04)}
tbody tr.clk:active{background:rgba(255,255,255,.07)}
.rank{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
  background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc-ink);font-size:10.5px;font-weight:800;margin-right:7px}
.pos{color:var(--green);font-weight:700}.neg{color:var(--red);font-weight:700}

/* ---- segmented controls ---- */
.seg{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:8px 6px;font-size:12px;font-weight:700;border:1px solid var(--line);
  background:rgba(24,35,61,.6);color:#c3cee2;border-radius:10px;cursor:pointer;
  transition:all .2s var(--ease)}
.seg button:hover{border-color:var(--line2);color:#fff}
.seg button.on{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,var(--acc2)));
  color:#fff;border-color:transparent;box-shadow:0 8px 20px -10px var(--acc)}

/* ---- drill lists / explorer ---- */
.dl{list-style:none;padding:0;margin:9px 0 0;font-size:12.5px}
.dl li{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--line);border-radius:6px;transition:background .15s}
.dl li.clk{cursor:pointer;color:var(--acc-ink)}
.dl li.clk:hover{background:rgba(255,255,255,.04)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px;vertical-align:middle}
.bcrumb{font-size:11.5px;margin:4px 0 10px;font-weight:700;line-height:1.5}
.crmb{cursor:pointer;color:var(--acc)}.crmb:hover{text-decoration:underline}
.exsel{font-size:12.5px;padding:10px 12px;background:rgba(24,35,61,.6);border:1px solid var(--line);border-radius:10px;margin-top:10px}
.opsh{border-top:none}
.agbar{display:flex;align-items:center;gap:9px;font-size:12px;padding:5px 0}
.agbar .nm{flex:0 0 36%;color:#c3cee2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agbar .br{flex:1;background:rgba(255,255,255,.06);border-radius:6px;height:15px;overflow:hidden}
.agbar .br>i{display:block;height:100%;border-radius:6px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 75%,#fff),var(--acc));
  animation:growx .8s var(--ease) both}
.agbar .vl{flex:0 0 auto;font-weight:700;font-size:11px}
@keyframes growx{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cmp select{margin-top:0}
.lgi{width:18px;height:18px;border-radius:5px;object-fit:contain;vertical-align:middle;margin-right:7px}
.glogo img{height:34px;margin-bottom:8px}

/* ---- ask bar (command-palette feel) ---- */
.askrow{display:flex;gap:8px;margin-top:10px}
.askrow input{flex:1;min-width:0;padding:11px 13px;font-size:13.5px;border:1px solid rgba(255,255,255,.16);border-radius:12px;
  background:rgba(255,255,255,.07);color:#fff;transition:border-color .2s,box-shadow .2s,background .2s}
.askrow input::placeholder{color:rgba(255,255,255,.58)}
.askrow input:focus{outline:none;border-color:var(--acc);background:rgba(255,255,255,.1);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
.askrow button{padding:0 18px;font-size:13.5px;font-weight:700;color:#fff;border:none;border-radius:12px;cursor:pointer;flex:0 0 auto;
  background:linear-gradient(135deg,#ff6b70,#ff4d52);box-shadow:0 8px 20px -10px rgba(255,90,95,.8);transition:transform .15s,filter .2s}
.askrow button:hover{filter:brightness(1.06)}.askrow button:active{transform:scale(.96)}
.qbar{display:flex;gap:8px}
.qbar input{flex:1;padding:12px 13px;font-size:14px;border:1px solid var(--line);border-radius:12px;background:rgba(24,35,61,.6);color:var(--ink)}
.qbar input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.qbar button{padding:0 18px;font-size:14px;font-weight:700;color:#fff;background:var(--acc);border:none;border-radius:12px;cursor:pointer}
.qsug{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.qchip{font-size:11px;font-weight:600;background:rgba(255,255,255,.05);color:#c3cee2;border:1px solid var(--line);border-radius:18px;
  padding:6px 11px;cursor:pointer;transition:all .18s var(--ease)}
.qchip:hover{background:rgba(255,255,255,.1);border-color:var(--line2);transform:translateY(-1px)}
.qa{font-size:13.5px;line-height:1.6;background:linear-gradient(120deg,rgba(79,156,249,.1),rgba(79,156,249,.02));
  border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:11px;padding:12px 14px;margin-bottom:11px;position:relative;
  animation:fadeUp .4s var(--ease) both}
.askrow{position:relative}
#qans{max-width:960px;margin:0 auto;padding:11px 12px 0;display:none}
.qx{position:absolute;top:8px;right:11px;cursor:pointer;color:var(--muted);font-weight:700;font-size:15px;transition:color .15s}
.qx:hover{color:var(--ink)}

/* ---- highlights ---- */
.hl-item{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;padding:10px 0;border-bottom:1px solid var(--line)}
.hl-item:last-child{border-bottom:none}
.hl-badge{flex:0 0 auto;font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:4px 8px;border-radius:20px;
  color:#fff;margin-top:1px;min-width:56px;text-align:center;box-shadow:0 6px 14px -8px rgba(0,0,0,.7)}
.hl-strength .hl-badge{background:linear-gradient(135deg,#1f9d57,#15803d)}
.hl-risk .hl-badge{background:linear-gradient(135deg,#e0413a,#b02a22)}
.hl-watch .hl-badge{background:linear-gradient(135deg,#eaa015,#d97706)}

/* ---- verdict line ---- */
.verdict{display:flex;gap:12px;align-items:flex-start;
  background:linear-gradient(120deg,rgba(79,156,249,.15),rgba(139,108,246,.05));
  border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:var(--r);padding:13px 15px;margin-bottom:12px;
  font-size:13.5px;line-height:1.5;color:var(--ink2);box-shadow:var(--sh-1)}
.verdict .vi{flex:0 0 auto;font-size:18px;margin-top:-1px;filter:saturate(1.2)}
.verdict b{color:#fff;font-weight:800}

/* ---- sparklines & deltas ---- */
.spark{display:block;width:100%;height:28px;margin-top:9px;overflow:visible}
.spark path.ln{fill:none;stroke:var(--acc);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 1px 6px color-mix(in srgb,var(--acc) 60%,transparent));
  stroke-dasharray:1;stroke-dashoffset:0}
.spark path.fillp{stroke:none}
.lspark{width:64px;height:20px;vertical-align:middle;overflow:visible}
.delta{font-weight:800}.delta.up{color:var(--green)}.delta.down{color:var(--red)}

/* ---- movers ---- */
.mv{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.mv:last-child{border-bottom:none}
.mv .mvd{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;font-size:11px;flex:0 0 auto}
.mv .nm{flex:1;font-weight:600}.mv .d{font-weight:800;font-size:13px;flex:0 0 auto}
.mv .t3{font-size:10px;color:var(--muted);flex:0 0 auto;width:76px;text-align:right}

/* ---- health gauge ---- */
.gauge-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.gscore{font-size:38px;font-weight:800;letter-spacing:-1.6px;line-height:1}
.gscore small{font-size:14px;color:var(--muted);font-weight:700}
.gstage{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:4px 10px;border-radius:20px;display:inline-block;margin-top:7px}
.gcomp{flex:1;min-width:210px}
.gbar{display:flex;align-items:center;gap:9px;font-size:11px;margin:7px 0}
.gbar .gl{flex:0 0 100px;color:var(--ink2)}
.gbar .gt{flex:1;height:7px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden}
.gbar .gt>i{display:block;height:100%;border-radius:5px;animation:growx .9s var(--ease) both}
.gbar .gv{flex:0 0 28px;text-align:right;font-weight:700;color:var(--muted)}

/* ---- sliders / what-if ---- */
.sld{margin:13px 0}
.sld label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink2)}
.sld label b{color:#fff}
.sld input[type=range]{width:100%;accent-color:var(--acc);height:6px}
.wf-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-top:13px}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.dchip{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.dchip.up{color:var(--green);border-color:rgba(61,220,151,.3)}.dchip.down{color:var(--red);border-color:rgba(251,113,133,.3)}
.uerow{display:flex;justify-content:space-between;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.uerow:last-child{border-bottom:none}.uerow b{font-weight:800}

/* ============================================================
   Unlock gate — cinematic first impression
   ============================================================ */
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:22px;overflow:hidden;
  background:
    radial-gradient(900px 520px at 50% -10%,rgba(79,156,249,.22),transparent 60%),
    radial-gradient(720px 520px at 86% 112%,rgba(139,108,246,.18),transparent 62%),
    linear-gradient(160deg,#05080f,#0a1430);
  transition:opacity .55s var(--ease),transform .55s var(--ease)}
#gate::before{content:"";position:absolute;inset:-30%;pointer-events:none;
  background:radial-gradient(36% 34% at 28% 24%,rgba(56,120,255,.24),transparent 70%),
            radial-gradient(34% 32% at 74% 72%,rgba(139,108,246,.2),transparent 72%);
  filter:blur(34px);animation:drift 20s ease-in-out infinite alternate}
#gate.out{opacity:0;transform:scale(1.05);pointer-events:none}
.gwrap{position:relative;width:100%;max-width:344px;text-align:center}
.gmark{width:66px;height:66px;border-radius:19px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:800;color:#fff;letter-spacing:-1px;
  background:linear-gradient(150deg,#1e3f73,#0c1d42);border:1px solid rgba(255,255,255,.16);
  box-shadow:0 20px 46px -16px rgba(56,120,255,.7), inset 0 1px 0 rgba(255,255,255,.22);
  animation:pop .7s var(--ease) both}
.gmark span{color:#ff5a5f}
.gtitle{font-size:25px;font-weight:800;color:#eef3fc;letter-spacing:-.4px;animation:fadeUp .6s .05s var(--ease) both}
.gtitle span{color:#ff5a5f}
.gsub{font-size:11.5px;color:var(--muted);margin:6px 0 22px;letter-spacing:.4px;text-transform:uppercase;animation:fadeUp .6s .1s var(--ease) both}
.gcard{background:linear-gradient(168deg,rgba(23,32,55,.74),rgba(11,17,33,.82));border:1px solid var(--line2);border-radius:var(--r-lg);
  padding:22px 22px 20px;box-shadow:0 30px 80px -28px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:fadeUp .6s .15s var(--ease) both}
.gcard.shake{animation:shake .4s var(--ease)}
.glab{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;text-align:left;margin-bottom:7px}
#gate input{width:100%;padding:13px 14px;font-size:16px;border:1px solid var(--line2);border-radius:12px;margin-bottom:12px;
  text-align:center;background:rgba(8,14,28,.6);color:var(--ink);letter-spacing:2px;transition:border-color .2s,box-shadow .2s}
#gate input::placeholder{color:var(--muted);letter-spacing:3px}
#gate input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
#gate button{width:100%;padding:13px;font-size:15px;font-weight:700;color:#fff;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,#3b82f6,#5aa2ff);box-shadow:0 14px 30px -12px rgba(59,130,246,.7);
  transition:transform .15s var(--ease),filter .2s}
#gate button:hover{filter:brightness(1.07)}#gate button:active{transform:scale(.98)}
#pwerr{display:none;color:var(--red);font-size:12px;margin-top:11px;font-weight:600}
.gfoot{font-size:10px;color:rgba(255,255,255,.5);margin-top:16px;letter-spacing:.5px;animation:fadeUp .6s .2s var(--ease) both}

/* ============================================================
   Motion
   ============================================================ */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px) scale(.992);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
@keyframes pop{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-7px)}}
#app{transition:opacity .26s var(--ease)}
#app.swap{opacity:0}
#app>*{animation:fadeUp .55s var(--ease) both}
#app>*:nth-child(2){animation-delay:.04s}#app>*:nth-child(3){animation-delay:.08s}
#app>*:nth-child(4){animation-delay:.12s}#app>*:nth-child(5){animation-delay:.16s}
#app>*:nth-child(6){animation-delay:.2s}#app>*:nth-child(7){animation-delay:.24s}
#app>*:nth-child(n+8){animation-delay:.28s}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  body::before{animation:none}
}
@media (max-width:520px){
  .cohead .nm{font-size:20px}.kpi .v{font-size:20px}.gscore{font-size:34px}
}

/* ---- Budgets tab ---- */
.btbl{width:100%;border-collapse:collapse;font-size:12.5px}
.btbl thead th{font-size:9.5px;text-transform:uppercase;color:var(--muted);font-weight:800;letter-spacing:.4px;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
.btbl thead th:first-child{text-align:left}
.brow td{padding:6px 6px;text-align:right;border-bottom:1px solid var(--line)}
.brow.head td{font-weight:800;color:var(--ink)}
.brow.gp td{font-weight:800;color:var(--ink);background:rgba(255,255,255,.035)}
.brow.det td{color:var(--ink2);font-size:11.5px}
.brow.det td:first-child{color:var(--muted)}
.brow.head:hover td{background:rgba(255,255,255,.04)}
.bnum{font-weight:800}
.bexp{color:var(--acc);font-weight:800;display:inline-block;width:12px}
.bflag{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--amber);color:#3a2a00;font-size:10px;font-weight:900;cursor:help;vertical-align:middle;margin-left:3px}
.bnote{cursor:help;font-size:11px;vertical-align:middle;opacity:.85;margin-left:2px}
.banno{font-size:12px;color:var(--ink2);padding:6px 0;border-bottom:1px solid var(--line);line-height:1.45}
.banno:last-child{border-bottom:none}.banno b{color:var(--ink)}
.kpi .v.neg{color:var(--red)}
.brow.det.bbr td{font-size:11px;font-style:italic;color:var(--muted);background:rgba(255,255,255,.02)}
.brow.det.bbr td:first-child{color:var(--ink2)}
.brow.det.bbr .bnum{font-style:normal;font-weight:800;color:var(--acc)}
.bhint{margin-top:9px;font-size:11px;color:var(--muted);line-height:1.5}
.bhint b{color:var(--ink2)}

/* ===== Budget vs Actual (FY83/84) ===== */
.vtbl{width:100%}
.vtbl th.r,.vtbl td.r,.vmini th.r,.vmini td.r{text-align:right;font-variant-numeric:tabular-nums}
.vrow{cursor:pointer;transition:background .15s}
.vrow:hover{background:rgba(255,255,255,.04)}
.vrow.on{background:rgba(30,111,217,.10)}
.vcar{display:inline-block;width:12px;color:var(--acc);font-size:11px}
.vtbl .up,.vmini .up{color:var(--green);font-weight:700}
.vtbl .down,.vmini .down{color:var(--red);font-weight:700}
.vtbl .muted,.vmini .muted,.vflags .muted{color:var(--dim);opacity:.75}
.vsub>td{padding:0!important;background:rgba(0,0,0,.18)}
.vwrap{display:flex;flex-wrap:wrap;gap:16px;padding:14px 16px 18px}
.vhalf{flex:1 1 320px;min-width:280px}
.vh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.vmini{width:100%;font-size:12.5px}
.vmini td,.vmini th{padding:4px 8px}
.vmini .vtot td{border-top:1px solid rgba(255,255,255,.16);font-weight:800}
.vchip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:700;
  letter-spacing:.02em;border:1px solid transparent}
.vchip-ok{color:var(--green);border-color:rgba(61,220,151,.32);background:rgba(61,220,151,.10)}
.vchip-warn{color:#f5b544;border-color:rgba(245,181,68,.32);background:rgba(245,181,68,.10)}
.vchip-bad{color:var(--red);border-color:rgba(251,113,133,.32);background:rgba(251,113,133,.10)}
.vflags{margin:6px 0 0;padding-left:18px}
.vflags li{font-size:12.5px;color:var(--dim);margin:3px 0;line-height:1.45}
.seg-sm button{font-size:11.5px;padding:4px 10px}

function nMon(c){return alen(c.monthly.rev_a)}
function ytd(a,n){let s=0;for(let i=0;i<n;i++)if(typeof a[i]==='number')s+=a[i];return s}

function lastYoY(c){const n=nMon(c);if(n<1)return null;const a=c.monthly.rev_a[n-1],p=c.monthly.rev_p[n-1];return (typeof a==='number'&&typeof p==='number'&&p)?a/p-1:null}
function mom3(c){const n=nMon(c);if(n<6)return null;const r=c.monthly.rev_a,l=r[n-1]+r[n-2]+r[n-3],pr=r[n-4]+r[n-5]+r[n-6];return pr?l/pr-1:null}

function forecast(c){const n=nMon(c),ytdA=ytd(c.monthly.rev_a,n),proj=n?ytdA/n*12:0,fyBud=ytd(c.monthly.rev_b,12)||c.tot.rev.b;return {proj,fyBud,vsBud:fyBud?proj/fyBud-1:null,n}}
function cashInj(c){let cum=0;(c.years||[]).forEach(y=>{if(y.eb<0)cum+=y.eb});return cum}
function costRatio(c,b){const x=(c.ctree||[]).find(z=>z.n.indexOf(b)>=0);return x?x.v/(c.tot.rev.a||1):0}
function concentration(c){const rt=c.rtree||[];if(!rt.length)return 0;const tot=rt.reduce((a,x)=>a+x.v,0)||1;return rt[0].v/tot}
function clamp(x){return Math.max(2,Math.min(100,x))}

  else comp=[{k:'Growth',v:clamp(((r.yoy||0)+0.10)/0.60*100)},{k:'Burn efficiency',v:clamp(100-(Math.abs(t.eb||0)/(t.rev.a||1))*45)},{k:'Vs plan',v:clamp((r.bud||0)*100)},{k:'Revenue scale',v:clamp(Math.log10(Math.max(10,t.rev.a||1))/9.5*100)},{k:'Path to profit',v:clamp(((r.eb_m||-1)+1)*100)}];

  return `<div class="card opsh"><h2>Cash injected <span class="tag">cumulative EBITDA burn</span></h2><div class="strip">${stat('This year','NPR '+fmt(Math.abs(c.tot.eb)))}${stat('Cumulative ('+((c.years||[]).length||1)+'yr)','NPR '+fmt(Math.abs(cum)))}${stat('Burn / month','NPR '+fmt(Math.abs(c.tot.eb)/n))}</div></div>`}

  return `<div class="card opsh"><h2>Unit economics <span class="tag">${DATA.companies[name].sector}</span></h2>${ue.map(x=>`<div class="uerow"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`}
let WF={mode:'co',co:'eSewa',g:0,cg:0,drv:false,dr:{}};
function wfBase(){if(WF.mode==='grp'){const rev=DATA.group.revenue,eb=DATA.group.ebitda;return {rev,cost:rev-eb,eb}}const c=DATA.companies[WF.co];return {rev:c.tot.rev.a,cost:c.tot.rev.a-(c.tot.eb||0),eb:(c.tot.eb||0)}}
function whatif(){setAcc('#4f9cf9');const opt=DATA.order.map(n=>`<option value="${n}">${n}</option>`).join('');

   <div class="card"><div class="seg" id="wfmode"><button data-m="co" class="${WF.mode==='co'?'on':''}">Single company</button><button data-m="grp" class="${WF.mode==='grp'?'on':''}">Whole group</button></div>

    <div class="seg" style="flex-wrap:wrap" id="wfpre"><button data-p="base">Reset</button><button data-p="rev">+10% revenue</button><button data-p="cost">−10% cost</button><button data-p="be">Break-even</button><button data-p="stretch">Stretch</button></div>

  if(!DATA.companies[WF.co])WF.co=DATA.order[0];if(el('wfco'))el('wfco').value=WF.co;

  if(el('wfco'))el('wfco').onchange=()=>{WF.co=el('wfco').value;WF.dr={};if(WF.drv)wfDrivers();wfRender()};
  const off=()=>{if(WF.drv){WF.drv=false;if(el('wfdrv'))el('wfdrv').textContent='▸ driver-level adjustments';if(el('wfdrvbox'))el('wfdrvbox').innerHTML=''}};
  el('wfg').oninput=()=>{WF.g=+el('wfg').value;el('wfgL').textContent=WF.g+'%';off();wfRender()};
  el('wfcg').oninput=()=>{WF.cg=+el('wfcg').value;el('wfcgL').textContent=WF.cg+'%';off();wfRender()};
  if(el('wfdrv'))el('wfdrv').onclick=()=>{WF.drv=!WF.drv;el('wfdrv').textContent=(WF.drv?'▾':'▸')+' driver-level adjustments';wfDrivers();wfRender()};
  if(WF.drv&&el('wfdrv')){el('wfdrv').textContent='▾ driver-level adjustments';wfDrivers()}wfRender();}
function wfPreset(p){WF.drv=false;WF.dr={};const b=wfBase();
  if(p==='base'){WF.g=0;WF.cg=0}else if(p==='rev'){WF.g=10;WF.cg=0}else if(p==='cost'){WF.g=0;WF.cg=-10}else if(p==='stretch'){WF.g=20;WF.cg=-10}
  else if(p==='be'){if(b.cost>b.rev){WF.g=Math.round((b.cost/b.rev-1)*100);WF.cg=0}else{WF.cg=Math.round((b.rev/b.cost-1)*100);WF.g=0}}
  if(el('wfg')){el('wfg').value=WF.g;el('wfgL').textContent=WF.g+'%'}if(el('wfcg')){el('wfcg').value=WF.cg;el('wfcgL').textContent=WF.cg+'%'}
  if(el('wfdrv'))el('wfdrv').textContent='▸ driver-level adjustments';if(el('wfdrvbox'))el('wfdrvbox').innerHTML='';wfRender();}
function wfDrivers(){const box=el('wfdrvbox');if(!box)return;if(!WF.drv||WF.mode!=='co'){box.innerHTML='';return}
  const c=DATA.companies[WF.co],heads=(c.rtree||[]).slice(0,4),buckets=(c.ctree||[]).slice(0,4);
  let h='<div style="font-size:9.5px;color:var(--muted);font-weight:700;margin:10px 0 2px">REVENUE LINES</div>';
  heads.forEach((x,i)=>h+=`<div class="sld"><label>${x.n} <b id="drL_r${i}">${WF.dr['r'+i]||0}%</b></label><input type="range" data-t="r" data-i="${i}" min="-50" max="100" value="${WF.dr['r'+i]||0}"></div>`);
  h+='<div style="font-size:9.5px;color:var(--muted);font-weight:700;margin:10px 0 2px">COST BUCKETS</div>';
  buckets.forEach((x,i)=>h+=`<div class="sld"><label>${x.n} <b id="drL_c${i}">${WF.dr['c'+i]||0}%</b></label><input type="range" data-t="c" data-i="${i}" min="-50" max="100" value="${WF.dr['c'+i]||0}"></div>`);
  box.innerHTML=h;
  box.querySelectorAll('input[type=range]').forEach(inp=>inp.oninput=()=>{const k=inp.dataset.t+inp.dataset.i;WF.dr[k]=+inp.value;el('drL_'+k).textContent=inp.value+'%';wfRender()});}
function wfRender(){const base=wfBase();let rev1,cost1;
  if(WF.mode==='co'&&WF.drv&&(DATA.companies[WF.co].rtree||[]).length){const c=DATA.companies[WF.co],heads=(c.rtree||[]).slice(0,4),buckets=(c.ctree||[]).slice(0,4);
    rev1=(base.rev-heads.reduce((a,x)=>a+x.v,0))+heads.reduce((a,x,i)=>a+x.v*(1+((WF.dr['r'+i]||0)/100)),0);
    cost1=(base.cost-buckets.reduce((a,x)=>a+x.v,0))+buckets.reduce((a,x,i)=>a+x.v*(1+((WF.dr['c'+i]||0)/100)),0);}
  else{rev1=base.rev*(1+WF.g/100);cost1=base.cost*(1+WF.cg/100)}
  const eb1=rev1-cost1,m1=rev1?eb1/rev1:0,d=eb1-base.eb;
  el('wfout').innerHTML=stat('Revenue','NPR '+fmt(rev1))+stat('Cost','NPR '+fmt(cost1))+stat('EBITDA','NPR '+fmt(eb1),eb1>=0?'pos':'neg')+stat('Margin',Mm(m1),m1>=0?'pos':'neg')+stat('Δ EBITDA',(d>=0?'+':'−')+fmt(Math.abs(d)),d>=0?'pos':'neg');
  let note='';if(WF.mode==='co'){const gnew=DATA.group.ebitda+d;note=`Effect on <b>group EBITDA</b>: NPR ${fmt(DATA.group.ebitda)} → <b>NPR ${fmt(gnew)}</b>.`;}
  if(base.eb<0){const need=Math.round((base.cost/base.rev-1)*100),cut=Math.round((1-base.rev/base.cost)*100);note+=` ${WF.mode==='co'?WF.co:'The group'} reaches break-even at about <b>+${need}% revenue</b> (cost held) — or a <b>${cut}% cost cut</b>.`;}
  el('wfbe').innerHTML=note;
  const afterRev=base.eb+(rev1-base.rev),b0=base.eb/1e6,aR=afterRev/1e6,sc=eb1/1e6;
  charts.filter(x=>x.canvas&&x.canvas.id==='wfch').forEach(x=>x.destroy());
  myChart(el('wfch'),{type:'bar',data:{labels:['Now','Revenue Δ','Cost Δ','Scenario'],datasets:[{data:[[0,b0],[Math.min(b0,aR),Math.max(b0,aR)],[Math.min(aR,sc),Math.max(aR,sc)],[0,sc]],backgroundColor:[base.eb>=0?'#34d399':'#fb7185','#4f9cf9','#e08e0b',eb1>=0?'#7fb4ff':'#fb7185'],borderWidth:0,barPercentage:.9}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>fmt((x.raw[1]-x.raw[0])*1e6)}}},scales:{y:{ticks:{callback:v=>fmt(v*1e6)}}}}});}

/* budgets.js — Budget vs last-two-years-actuals, recursive drill-down (index tree, unlimited depth).
   Values NPR millions. v=[FY81/82 A, FY82/83 A, FY83/84 B].
   Row keys: h=heading(L0) · k=expand key · pk=parent key · g=subtotal · int=integer · br=bridge(decomposition)
             cmt=team comment · flag=our review flag · note=extra note. A row is visible when every ancestor is open. */
let bCo='F1Soft'; let bOpen={};

/* BUD must be resolved at CALL time, not load time — DATA is null until the user unlocks.
   Each view resolves it locally via bData(). */
function bData(){ return (typeof DATA!=="undefined"&&DATA&&DATA.budgets)?DATA.budgets:{}; }

function bFmt(v,int){ if(v==null)return '–'; if(int)return Math.round(v); if(v===0)return '–'; const a=Math.abs(v); const s=a>=1000?a.toLocaleString(undefined,{maximumFractionDigits:0}):a.toFixed(1); return (v<0?'(':'')+s+(v<0?')':''); }
function bGrow(a,b){ if(a==null||a===0||b==null)return null; return b/a-1; }

function bSeg(){ const BUD=bData(); return '<div class="seg" style="margin-bottom:12px;flex-wrap:wrap">'
  +Object.keys(BUD).map(c=>`<button class="${c===bCo?'on':''}" onclick="bCo='${c}';bOpen={};budgets();animateNums()">${BUD[c].name.split(' ')[0]}</button>`).join('')
  +`<button class="${bCo==='__cmp'?'on':''}" onclick="bCo='__cmp';budgets();animateNums()">⚖ Compare all</button></div>`; }
function budgets(){
 if(bCo==='__cmp')return budgetsCompare();
 const BUD=bData(); const B=BUD[bCo]; if(!B){el('app').innerHTML='<div class="card">Loading budgets…</div>';return;} setAcc(B.accent);
 const g=(a,b)=>Pp(bGrow(a,b));
 // index: key -> row, and parent lookups
 const byKey={}; B.rows.forEach(r=>{ if(r.k)byKey[r.k]=r; });
 const parentOf=r=>r.pk?byKey[r.pk]:null;
 const depth=r=>{ let d=0,c=r; while(c&&c.pk){d++;c=byKey[c.pk];} return d; };
 const visible=r=>{ let c=r; while(c&&c.pk){ if(!bOpen[c.pk])return false; c=byKey[c.pk]; } return true; };
 const hasKids=r=>r.k&&B.rows.some(x=>x.pk===r.k);
 let h='';
 // company toggle
 h+=bSeg();
 // header
 h+=`<div class="cohead"><div class="row"><div class="coini">${B.name[0]}</div><div><div class="nm">${B.name}</div><div class="pill2">FY 2083/84 Budget · vs last two years</div></div></div>`
  +`<div class="hl">Budget vs FY82/83 Actual and FY81/82 Actual, growth against last year. Tap any ▸ to drill — buckets open to detail lines, and each Salary line opens the growth bridge (base effect · increment · new hires). Badges carry the team’s notes 💬 and our review flags !.</div></div>`;
 // KPIs
 h+='<div class="kpis">'
  +kpi('Revenue — Budget','NPR '+fmt(B.rev[2]*1e6),g(B.rev[1],B.rev[2])+' vs FY82/83')
  +kpi('EBITDA — Budget','NPR '+fmt(B.eb[2]*1e6),g(B.eb[1],B.eb[2])+' vs FY82/83',(B.eb[2]<0?'neg':''))
  +kpi('Total cost — Budget','NPR '+fmt(B.tc[2]*1e6),g(B.tc[1],B.tc[2])+' vs FY82/83')
  +kpi('Headcount','+'+(B.hc[2]-B.hc[1]),B.hc[1]+' → '+B.hc[2])
  +'</div>';
 // biggest movers (real lines only)
 const mv=B.rows.filter(r=>!r.g&&!r.int&&!r.br&&r.v[1]!=null&&r.v[2]!=null).map(r=>({l:r.l,a:r.v[1],b:r.v[2],d:r.v[2]-r.v[1],p:bGrow(r.v[1],r.v[2]),fl:r.flag})).filter(r=>Math.abs(r.d)>=1).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,6);
 h+='<div class="card"><h2>Biggest movers — Budget vs FY82/83<span class="tag">what changed</span></h2>';
 mv.forEach(m=>{ const up=m.d>=0; h+=`<div class="mv"><span class="mvd" style="background:${up?'rgba(251,113,133,.16)':'rgba(61,220,151,.16)'};color:${up?'var(--red)':'var(--green)'}">${up?'▲':'▼'}</span><span class="nm">${m.l}${m.fl?' <span class="bflag" title="'+m.fl.replace(/"/g,'&quot;')+'">!</span>':''}</span><span class="t3">${bFmt(m.a)} → ${bFmt(m.b)}</span><span class="d" style="color:${up?'var(--red)':'var(--green)'}">${Pp(m.p)}</span><span class="t3" style="width:64px">${up?'+':''}${bFmt(m.d)}</span></div>`; });
 h+='</div>';
 // chart
 h+='<div class="card"><h2>Budget vs actuals — key lines<span class="tag">NPR mn</span></h2><div class="chart-box"><canvas id="bvac"></canvas></div></div>';
 // drill table
 h+='<div class="card"><h2>Full budget — drill down<span class="tag">tap ▸ to expand</span></h2>';
 h+='<table class="btbl"><thead><tr><th style="text-align:left">Line (NPR mn)</th><th>81/82 A</th><th>82/83 A</th><th>83/84 B</th><th>Δ% vs LY</th><th>Δ abs</th></tr></thead><tbody>';
 B.rows.forEach(r=>{
   if(!visible(r)) return;
   const dp=depth(r), isHead=r.h&&dp===0, kids=hasKids(r);
   const gp=(r.br?null:bGrow(r.v[1],r.v[2])); const dv=(r.int||r.br?null:(r.v[2]==null||r.v[1]==null?null:r.v[2]-r.v[1]));
   const cls=r.br?'brow det bbr':(isHead?(r.g?'brow gp':'brow head'):'brow det');
   const badge=(r.cmt?`<span class="bnote" title="${r.cmt.replace(/"/g,'&quot;')}">💬</span>`:'')+(r.flag?`<span class="bflag" title="${r.flag.replace(/"/g,'&quot;')}">!</span>`:'')+(r.note?`<span class="bnote" title="${r.note.replace(/"/g,'&quot;')}">💬</span>`:'');
   const arrow=kids?`<span class="bexp">${bOpen[r.k]?'▾':'▸'}</span> `:'';
   const click=kids?` onclick="bOpen['${r.k}']=!bOpen['${r.k}'];budgets();animateNums()" style="cursor:pointer"`:'';
   const pad=8+dp*17;
   const v3=r.br?((r.v[2]>=0?'+':'')+bFmt(r.v[2])):bFmt(r.v[2],r.int);
   h+=`<tr class="${cls}"${click}><td style="text-align:left;padding-left:${pad}px">${arrow}${r.l} ${badge}</td>`
    +`<td>${bFmt(r.v[0],r.int)}</td><td>${bFmt(r.v[1],r.int)}</td><td class="bnum">${v3}</td>`
    +`<td class="${gp==null?'':(gp>=0?(r.g?'pos':'neg'):(r.g?'neg':'pos'))}">${gp==null?'–':Pp(gp)}</td>`
    +`<td>${dv==null?'–':(dv>=0?'+':'')+bFmt(dv)}</td></tr>`;
 });
 h+='</tbody></table><div class="bhint">Salary lines open a growth bridge: <b>base effect</b> (annualised Ashadh run-rate) · <b>15% increment</b> · <b>new hires</b>. The three sum to the salary increase.</div></div>';
 // notes
 const notes=B.rows.filter(r=>r.cmt||r.flag);
 h+='<div class="card"><h2>Notes from the budget file &amp; our review<span class="tag">comments · flags</span></h2><div class="ins">';
 notes.forEach(r=>{ if(r.flag)h+=`<div class="banno"><span class="bflag">!</span><b>${r.l}</b> — ${r.flag}</div>`; if(r.cmt)h+=`<div class="banno"><span class="bnote">💬</span><b>${r.l}</b> — <i>${r.cmt}</i></div>`; });
 h+='</div></div>';
 el('app').innerHTML=h;
 // chart
 const keys=['Revenue','Staff cost','Admin / operations','Marketing & business dev','EBITDA'];
 const pick=nm=>B.rows.find(r=>r.l===nm)||{v:[0,0,0]};
 myChart(el('bvac'),{type:'bar',data:{labels:['Revenue','Staff','Admin','Marketing','EBITDA'],
   datasets:[
    {label:'FY81/82 A',data:keys.map(k=>pick(k).v[0]),backgroundColor:'rgba(154,167,194,.55)'},
    {label:'FY82/83 A',data:keys.map(k=>pick(k).v[1]),backgroundColor:'rgba(79,156,249,.55)'},
    {label:'FY83/84 B',data:keys.map(k=>pick(k).v[2]),backgroundColor:B.accent}]},
   options:{plugins:{legend:{display:true}},scales:{x:{ticks:{color:'#93a1bd'}},y:{ticks:{color:'#93a1bd'}}}}});
}

 // main comparison table (metrics × companies + cluster)
 h+='<div class="card"><h2>Budget by company<span class="tag">FY83/84 · NPR mn</span></h2>';
 h+='<table class="btbl"><thead><tr><th style="text-align:left">Line (NPR mn)</th>'+cos.map(c=>`<th>${BUD[c].name.split(' ')[0]}</th>`).join('')+'<th>Cluster</th></tr></thead><tbody>';
 Object.keys(M).forEach(lab=>{ const get=M[lab]; const sub=(lab==='Revenue'||lab==='EBITDA'||lab==='Gross profit');
   h+=`<tr class="brow ${sub?'head':'det'}"><td style="text-align:left;padding-left:8px">${lab}</td>`

    +`<td class="bnum">${bFmt(clSum(get,2))}</td></tr>`;
 });
 // EBITDA margin row
 h+=`<tr class="brow det"><td style="text-align:left;padding-left:8px">EBITDA margin %</td>`
  +cos.map(c=>{const r=BUD[c].rev[2],e=BUD[c].eb[2];const m=r?e/r:null;return `<td class="${m<0?'neg':''}">${m==null?'–':(m*100).toFixed(0)+'%'}</td>`;}).join('')
  +`<td class="bnum">${(cEb/cRev*100).toFixed(0)}%</td></tr>`;
 // headcount row

  +cos.map(c=>`<td>${BUD[c].hc[2]}</td>`).join('')+`<td class="bnum">${cHc}</td></tr>`;
 h+='</tbody></table></div>';
 // growth table (Budget vs 82/83)

/* bva.js — FY2083/84 Budget vs Actual.
   Data comes from DATA.fy8384 (built by lib_fy8384_bva.py, encrypted into the payload).
   Resolve DATA at CALL time — it is null until the user unlocks.

   Index tree (unlimited depth, same convention as budgets.js):
     group  ->  company  ->  P&L line  ->  revenue line items
   vOpen[key] marks an expanded node; a row shows when every ancestor is open. */

let vOpen = {};            /* expanded company keys */
let vSort = 'var';         /* var | varpct | rev | name */

function vData(){ return (typeof DATA!=="undefined"&&DATA&&DATA.fy8384)?DATA.fy8384:null; }

const V_M = 1e6;
function vF(v,dp){ if(v==null||isNaN(v))return '–'; const a=Math.abs(v/V_M);
  const s=a>=100?a.toFixed(0):a.toFixed(dp==null?1:dp); return (v<0?'(':'')+s+(v<0?')':''); }
function vP(v){ if(v==null||isNaN(v))return '–'; return (v>=0?'+':'')+(v*100).toFixed(1)+'%'; }
/* red/green by whether the variance helps the group */
function vCls(v){ if(v==null||isNaN(v))return 'muted'; return v>=0?'up':'down'; }
function vSrcChip(s){
  if(s==='file')   return '<span class="vchip vchip-ok" title="Budget read from the company workbook">file</span>';
  if(s==='curated-phased') return '<span class="vchip vchip-warn" title="Workbook budget equals actual; using the curated annual budget phased on last year\'s seasonality">curated</span>';
  return '<span class="vchip vchip-bad" title="No usable budget in the workbook and none curated — variance suppressed">no budget</span>';
}

/* ---------- year switcher ---------- */
function vYearSeg(active){
  const D=vData();
  const lbl = D? `FY 2083/84 · ${D.cur_month}` : 'FY 2083/84';
  return '<div class="seg" style="margin-bottom:14px;flex-wrap:wrap">'
   +`<button class="${active==='84'?'on':''}" onclick="el('sel').value='bva';render()">${lbl} · Budget vs Actual</button>`
   +`<button class="${active==='83'?'on':''}" onclick="el('sel').value='group';render()">FY 2082/83 · Full year</button>`
   +'</div>';
}

/* ---------- main view ---------- */
function bva(){
  const D=vData();
  if(!D){ el('app').innerHTML='<div class="card">Budget-vs-actual data not available in this build.</div>'; return; }
  setAcc('#1E6FD9');
  const g=D.group||{}, gr=g.revenue||{}, ge=g.ebitda||{};
  const names=Object.keys(D.companies);

  let h=vYearSeg('84');

  /* headline */
  h+='<div class="kpis" style="margin-bottom:14px">'
   + kpi('Revenue · actual', vF(gr.actual), `${D.cur_month} · month ${D.month_index} of 12`)
   + kpi('Revenue · budget', vF(gr.budget), `${gr.covered}/${gr.total} companies have a budget`)
   + kpi('Revenue variance', vF(gr.var), vP(gr.var_pct), gr.var>=0?'up':'down')
   + kpi('EBITDA · actual', vF(ge.actual), 'vs budget '+vF(ge.budget))
   + '</div>';

  /* the honest bit — provenance + gaps */
  if((D.flags||[]).length){
    h+='<div class="card" style="margin-bottom:14px">'
      +'<div class="ttl">Data quality — read before using these variances</div><ul class="vflags">'
      +D.flags.map(f=>'<li>'+f+'</li>').join('')+'</ul></div>';
  }

  /* sortable company table with drill */
  const rows=names.slice().sort((a,b)=>{
    const A=D.companies[a], B=D.companies[b];
    if(vSort==='name')  return a.localeCompare(b);
    if(vSort==='rev')   return (B.revenue.actual||0)-(A.revenue.actual||0);
    if(vSort==='varpct')return (A.revenue.var_pct==null?9:A.revenue.var_pct)-(B.revenue.var_pct==null?9:B.revenue.var_pct);
    return (A.revenue.var==null?9e15:A.revenue.var)-(B.revenue.var==null?9e15:B.revenue.var);
  });

  h+='<div class="card"><div class="ttl">Budget vs actual by company '
   +'<span class="sub">— NPR m · click a company to drill into its P&amp;L and revenue lines</span></div>'
   +'<div class="seg seg-sm" style="margin:6px 0 10px">'
   +[['var','Worst variance'],['varpct','Worst %'],['rev','Largest revenue'],['name','A–Z']]
      .map(([k,l])=>`<button class="${vSort===k?'on':''}" onclick="vSort='${k}';bva();animateNums()">${l}</button>`).join('')
   +'</div>'
   +'<table class="tbl vtbl"><thead><tr>'
   +'<th>Company</th><th class="r">Rev actual</th><th class="r">Rev budget</th>'
   +'<th class="r">Var</th><th class="r">Var %</th><th class="r">EBITDA</th>'
   +'<th class="r">EB budget</th><th>Budget source</th></tr></thead><tbody>';

  rows.forEach(n=>{
    const c=D.companies[n], r=c.revenue, e=c.ebitda;
    const open=!!vOpen[n];
    h+=`<tr class="vrow${open?' on':''}" onclick="vOpen['${n}']=!vOpen['${n}'];bva();animateNums()">`
     +`<td><span class="vcar">${open?'▾':'▸'}</span> <b>${n}</b></td>`
     +`<td class="r">${vF(r.actual)}</td><td class="r">${vF(r.budget)}</td>`
     +`<td class="r ${vCls(r.var)}">${vF(r.var)}</td><td class="r ${vCls(r.var)}">${vP(r.var_pct)}</td>`
     +`<td class="r">${vF(e.actual)}</td><td class="r">${vF(e.budget)}</td>`
     +`<td>${vSrcChip(r.budget_source)}</td></tr>`;
    if(open) h+=vDrill(n,c);
  });
  h+='</tbody></table></div>';
  el('app').innerHTML=h;
  vChart(rows,D);
}

/* ---------- level 2 + 3: P&L bridge and revenue line items ---------- */
const V_PL=['Revenue','Direct cost','Gross profit','Staff cost','Admin cost','Marketing cost',
            'Business dev','ARL & growth','Total cost','EBITDA','Interest cost','CapEx'];
function vDrill(n,c){
  let h='<tr class="vsub"><td colspan="8"><div class="vwrap">';
  /* P&L bridge */
  h+='<div class="vhalf"><div class="vh">P&amp;L — '+n+'</div><table class="tbl vmini"><thead><tr>'
    +'<th>Line</th><th class="r">Actual</th><th class="r">Budget</th><th class="r">Var</th><th class="r">PY</th></tr></thead><tbody>';
  let any=false;
  V_PL.forEach(k=>{
    const p=(c.pl||{})[k]; if(!p)return; any=true;
    const v=(p.cm!=null&&p.bp!=null)?p.cm-p.bp:null;
    const isEb=(k==='EBITDA');
    h+=`<tr${isEb?' class="vtot"':''}><td>${k}</td><td class="r">${vF(p.cm)}</td>`
      +`<td class="r">${vF(p.bp)}</td><td class="r ${vCls(v)}">${vF(v)}</td><td class="r muted">${vF(p.py)}</td></tr>`;
  });
  const hc=(c.pl||{}).Headcount;
  if(hc&&hc.cm!=null) h+=`<tr><td>Headcount</td><td class="r">${Math.round(hc.cm)}</td>`
      +`<td class="r">${hc.bp!=null?Math.round(hc.bp):'–'}</td><td class="r">–</td>`
      +`<td class="r muted">${hc.py!=null?Math.round(hc.py):'–'}</td></tr>`;
  if(!any) h+='<tr><td colspan="5" class="muted">No P&amp;L block published for this company yet.</td></tr>';
  h+='</tbody></table></div>';

  /* revenue line items */
  const items=(c.revenue_items||[]).filter(x=>x.cm!=null||x.bp!=null);
  h+='<div class="vhalf"><div class="vh">Revenue lines</div><table class="tbl vmini"><thead><tr>'
    +'<th>Line</th><th class="r">Actual</th><th class="r">Budget</th><th class="r">Var</th><th class="r">PY</th></tr></thead><tbody>';
  if(!items.length) h+='<tr><td colspan="5" class="muted">No revenue detail published.</td></tr>';
  items.sort((a,b)=>(b.cm||0)-(a.cm||0)).forEach(it=>{
    const v=(it.cm!=null&&it.bp!=null)?it.cm-it.bp:null;
    h+=`<tr><td>${it.name}</td><td class="r">${vF(it.cm,2)}</td><td class="r">${vF(it.bp,2)}</td>`
      +`<td class="r ${vCls(v)}">${vF(v,2)}</td><td class="r muted">${vF(it.py,2)}</td></tr>`;
  });
  h+='</tbody></table></div>';

  /* annual context */
  const ab=c.annual_budget||{};
  if(ab.revenue||ab.ebitda){
    const pctRev=(ab.revenue&&c.revenue.actual!=null)?(c.revenue.actual/ab.revenue):null;
    h+='<div class="vhalf"><div class="vh">Against the full-year budget</div><table class="tbl vmini"><tbody>'
      +`<tr><td>Annual revenue budget</td><td class="r">${vF(ab.revenue)}</td></tr>`
      +`<tr><td>Delivered so far</td><td class="r">${pctRev!=null?(pctRev*100).toFixed(1)+'%':'–'}</td></tr>`
      +`<tr><td>Annual EBITDA budget</td><td class="r">${vF(ab.ebitda)}</td></tr>`
      +`<tr><td>Annual CapEx budget</td><td class="r">${vF(ab.capex)}</td></tr>`
      +'</tbody></table></div>';
  }
  h+='</div></td></tr>';
  return h;
}

/* ---------- chart: actual vs budget by company ---------- */
function vChart(names,D){
  const host=document.getElementById('vcanvas'); if(!host)return;
  const lab=names.filter(n=>D.companies[n].revenue.budget!=null);
  myChart('vcanvas',{type:'bar',
    data:{labels:lab,datasets:[
      {label:'Actual',data:lab.map(n=>(D.companies[n].revenue.actual||0)/V_M),backgroundColor:PAL[0]},
      {label:'Budget',data:lab.map(n=>(D.companies[n].revenue.budget||0)/V_M),backgroundColor:hexA(PAL[1],.55)}]},
    options:{plugins:{legend:{display:true}},scales:{y:{beginAtZero:true}}}});
}

const cm=hasBva?DATA.fy8384.cur_month:null;
el('ft').textContent='Management / group-consolidation basis; audited financials may differ (e.g. eSewa audited revenue is gross-of-passthrough). FY2082/83 = full year (12 months, through Ashadh); Ashadh includes year-end true-ups so the final month can look unusually large.'+(cm?' FY2083/84 = year to date through '+cm+'; budget-vs-actual variances carry a source chip (file / curated / no budget) — read the data-quality note on that tab.':'');
if(hasBva)el('sel').value='bva';render()}

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function decryptData(pw){var enc=new TextEncoder();var km=await crypto.subtle.importKey("raw",enc.encode(pw),{name:"PBKDF2"},false,["deriveKey"]);var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(ENC.s),iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.i)},key,b64(ENC.c));return JSON.parse(new TextDecoder().decode(pt))}
async function gate(){var pw=document.getElementById("pw").value;var err=document.getElementById("pwerr");err.style.display="none";try{DATA=await decryptData(pw);var g=document.getElementById("gate");document.getElementById("hdr").style.display="";init();g.classList.add("out");setTimeout(function(){g.style.display="none"},560)}catch(e){err.style.display="block";var c=document.getElementById("gcard");if(c){c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake")}var p=document.getElementById("pw");p.value="";p.focus()}}
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")gate()});
document.getElementById("pw").focus();
